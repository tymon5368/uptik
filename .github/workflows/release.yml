name: Release UpTik

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: ''
      draft:
        description: 'Create a draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux GTK & WebKitGTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Check Frontend (Svelte 5 & TypeScript)
        run: |
          cd frontend
          bun install --frozen-lockfile || bun install
          bun run check
          bun run build

      - name: Run Backend Tests
        run: |
          go test -tags "webkit2_41" ./...

  build:
    name: Build (${{ matrix.platform.name }})
    needs: [validate]
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux (amd64)
            id: linux-amd64
            os: ubuntu-22.04
            target: linux/amd64
            tags: "webkit2_41"
          - name: Windows (amd64)
            id: windows-amd64
            os: windows-latest
            target: windows/amd64
            tags: ""
          - name: macOS (Universal)
            id: darwin-universal
            os: macos-latest
            target: darwin/universal
            tags: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: meta
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [ "$RAW_TAG" = "master" ]; then
            RAW_TAG="v1.0.0"
          fi
          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Ensure NSIS on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v makensis &> /dev/null; then
            choco install -y nsis || winget install NSIS.NSIS --silent --accept-package-agreements --accept-source-agreements || true
            echo "C:/Program Files (x86)/NSIS" >> $GITHUB_PATH
            echo "C:/Program Files/NSIS" >> $GITHUB_PATH
          fi

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Frontend Dependencies
        shell: bash
        run: |
          cd frontend
          bun install
          bun run compile:i18n

      - name: Sync Version in Configuration Files
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          sed -i.bak "s/Version = \".*\"/Version = \"${VERSION}\"/" version.go || sed -i "" "s/Version = \".*\"/Version = \"${VERSION}\"/" version.go || true
          sed -i.bak "s/\"productVersion\": \".*\"/\"productVersion\": \"${VERSION}\"/" wails.json || sed -i "" "s/\"productVersion\": \".*\"/\"productVersion\": \"${VERSION}\"/" wails.json || true
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" frontend/package.json || sed -i "" "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" frontend/package.json || true
          sed -i.bak "s/let appVersion = \$state<string>('.*');/let appVersion = \$state<string>('${VERSION}');/" frontend/src/App.svelte || sed -i "" "s/let appVersion = \$state<string>('.*');/let appVersion = \$state<string>('${VERSION}');/" frontend/src/App.svelte || true

      - name: Build Application with Wails
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD_TAGS="${{ matrix.platform.tags }}"
          TARGET="${{ matrix.platform.target }}"
          
          EXTRA_FLAGS="-clean -trimpath -ldflags \"-X main.Version=${VERSION} -X main.Commit=${GITHUB_SHA::7}\""
          if [ -n "$BUILD_TAGS" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} -tags ${BUILD_TAGS}"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} -nsis"
          fi
          
          eval wails build -platform "${TARGET}" ${EXTRA_FLAGS}

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          PKG_NAME="uptik-${VERSION}-linux-amd64"
          mkdir -p artifacts

          # 1. Standalone Tarball (for manual installation & in-app self-updater)
          mkdir -p "dist-pkg/${PKG_NAME}"
          cp build/bin/uptik "dist-pkg/${PKG_NAME}/"
          cp uptik.desktop "dist-pkg/${PKG_NAME}/"
          cp build/appicon.png "dist-pkg/${PKG_NAME}/uptik.png"
          (cd dist-pkg && tar -czvf "../${PKG_NAME}.tar.gz" "${PKG_NAME}")
          mv "${PKG_NAME}.tar.gz" artifacts/

          # 2. Native Debian Package (.deb for Ubuntu, Debian, Mint, Pop!_OS)
          DEB_DIR="deb-pkg"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/512x512/apps"

          cp build/bin/uptik "${DEB_DIR}/usr/bin/uptik"
          chmod 755 "${DEB_DIR}/usr/bin/uptik"
          cp uptik.desktop "${DEB_DIR}/usr/share/applications/uptik.desktop"
          chmod 644 "${DEB_DIR}/usr/share/applications/uptik.desktop"
          cp build/appicon.png "${DEB_DIR}/usr/share/icons/hicolor/512x512/apps/uptik.png"
          chmod 644 "${DEB_DIR}/usr/share/icons/hicolor/512x512/apps/uptik.png"

          {
            echo "Package: uptik"
            echo "Version: ${VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: amd64"
            echo "Maintainer: UpTik <noreply@uptik.app>"
            echo "Description: TikTok Auto Scheduler & Omnichannel Video Studio"
            echo " UpTik is an omnichannel desktop studio for automated content scheduling"
            echo " across TikTok Studio, YouTube Shorts, and Meta Business Suite."
            echo "Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libayatana-appindicator3-1"
          } > "${DEB_DIR}/DEBIAN/control"

          dpkg-deb --build "${DEB_DIR}" "artifacts/uptik-${VERSION}-linux-amd64.deb"
          rm -rf "${DEB_DIR}" dist-pkg

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p artifacts
          
          # Standalone portable zip
          mkdir -p "uptik-${VERSION}-windows-amd64"
          cp build/bin/uptik.exe "uptik-${VERSION}-windows-amd64/"
          7z a "artifacts/uptik-${VERSION}-windows-amd64-portable.zip" "./uptik-${VERSION}-windows-amd64"
          
          # NSIS installer
          if [ -f "build/bin/uptik-amd64-installer.exe" ]; then
            cp "build/bin/uptik-amd64-installer.exe" "artifacts/uptik-${VERSION}-windows-amd64-setup.exe"
          elif ls build/bin/*installer*.exe 1> /dev/null 2>&1; then
            cp build/bin/*installer*.exe "artifacts/uptik-${VERSION}-windows-amd64-setup.exe"
          fi

      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p artifacts

          # 1. Universal Application Bundle (ZIP for in-app self-updater)
          ditto -c -k --sequesterRsrc --keepParent build/bin/uptik.app "artifacts/uptik-${VERSION}-macos-universal.zip"

          # 2. Apple Disk Image (DMG for standard drag-and-drop installation)
          mkdir -p dmg-staging
          cp -R build/bin/uptik.app dmg-staging/

          brew install create-dmg || true
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "UpTik" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "uptik.app" 160 190 \
              --hide-extension "uptik.app" \
              --app-drop-link 440 190 \
              "artifacts/uptik-${VERSION}-macos-universal.dmg" \
              "dmg-staging" || true
          fi

          # Fallback to hdiutil if create-dmg is unavailable or fails
          if [ ! -f "artifacts/uptik-${VERSION}-macos-universal.dmg" ]; then
            echo "create-dmg not used or failed, generating DMG via hdiutil..."
            ln -s /Applications dmg-staging/Applications
            hdiutil create -volname "UpTik" -srcfolder dmg-staging -ov -format UDZO "artifacts/uptik-${VERSION}-macos-universal.dmg"
          fi
          rm -rf dmg-staging

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.id }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: meta
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name || github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [ "$RAW_TAG" = "master" ]; then
            RAW_TAG="v1.0.0"
          fi
          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Generate Checksums (SHA256)
        shell: bash
        run: |
          cd downloaded-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: UpTik ${{ steps.meta.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            downloaded-artifacts/*
          body: |
            ## 🚀 UpTik ${{ steps.meta.outputs.tag }} - Omnichannel Desktop Studio
            
            Official release of **UpTik** desktop application supporting Windows, macOS, and Linux.

            ### 📦 Download Assets
            - **Windows**: 
              - Installer (NSIS Setup): `uptik-${{ steps.meta.outputs.version }}-windows-amd64-setup.exe`
              - Portable ZIP: `uptik-${{ steps.meta.outputs.version }}-windows-amd64-portable.zip`
            - **macOS**:
              - Apple Disk Image (DMG Installer): `uptik-${{ steps.meta.outputs.version }}-macos-universal.dmg`
              - Universal Application Bundle (ZIP): `uptik-${{ steps.meta.outputs.version }}-macos-universal.zip`
            - **Linux**:
              - Debian / Ubuntu Package (.deb): `uptik-${{ steps.meta.outputs.version }}-linux-amd64.deb`
              - Standalone Binary Tarball: `uptik-${{ steps.meta.outputs.version }}-linux-amd64.tar.gz`
            - **Checksum Verification**: `SHA256SUMS.txt`
            
            ### ✨ Key Highlights
            - **Omnichannel Golden Hour Scheduler**: Automatic time slot distribution (11:30 AM, 6:30 PM, 9:30 PM) across a 30-day horizon with Collision Guard.
            - **Zero-API Chrome CDP Driver**: Direct web automation for TikTok Studio, YouTube Shorts, and Meta Business Suite using active browser sessions.
            - **Transactional Outbox Queue**: Resilient SQLite persistence (WAL mode) with self-healing crash recovery on startup.
            - **Safety Circuit Breaker**: Automatic queue suspension on checkpoint, captcha, or HTTP 429 rate limit detection.
            - **Native Desktop Lifecycle**: Cross-platform system tray, close-to-tray background execution, and system boot autostart.
            - **Modern Studio Interface**: Engineered with Svelte 5 Runes, Netflix Studio Dark Theme, and 100% Lucide Icons.
